<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Essays</title>
    <!-- Inline on purpose: must paint before any JS/CSS bundle loads, in the right theme. -->
    <style>
      html, body { margin: 0; height: 100%; background: #ffffff; }
      .splash {
        height: 100vh; display: flex; align-items: center; justify-content: center;
      }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(128, 128, 128, 0.25); border-top-color: #3b82f6;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html, body { background: #1c1d20; }
      }
    </style>
  </head>

  <body>
    <div id="root"><div class="splash"><div class="spinner"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
