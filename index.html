<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Essays</title>
    <!-- Inline on purpose: must paint before any JS/CSS bundle loads, in the right theme. -->
    <style>
      html, body { margin: 0; height: 100%; background: #ffffff; }
      .splash {
        height: 100vh; display: flex; align-items: center; justify-content: center;
      }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(128, 128, 128, 0.25); border-top-color: #4f6df5;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #1e1f24; }
    </style>
    <script>
      // Same logic as src/theme.ts, run synchronously so the very first paint is themed.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("theme") || "system"; } catch (e) {}
        var dark = pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>

  <body>
    <div id="root"><div class="splash"><div class="spinner"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
