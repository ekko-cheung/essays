[package]
name = "essays"
version = "0.5.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
essays-core = { path = "../core" }
gpui-kit = { version = "=0.11.0", default-features = false, features = ["component", "assets", "tree-sitter-markdown", "tree-sitter-markdown-inline", "syntect"] }
markdown = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = "0.24"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
