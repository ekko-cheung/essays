<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7390ff"/>
      <stop offset="1" stop-color="#3b4ad1"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#e2392f"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe17a"/>
      <stop offset="0.55" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#e9a21f"/>
    </linearGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="820" cy="170" r="260" fill="#ffffff" opacity="0.07"/>
    <circle cx="150" cy="900" r="300" fill="#000000" opacity="0.06"/>
  </g>

  <!-- paper: shadow, sheet, ruled lines -->
  <path d="M262 716 L802 716 L866 884 L186 884 Z" fill="#141a66" opacity="0.28" stroke="#141a66" stroke-width="10" stroke-linejoin="round"/>
  <path d="M250 700 L790 700 L850 870 L170 870 Z" fill="#fdfdfb" stroke="#fdfdfb" stroke-width="10" stroke-linejoin="round"/>
  <g stroke="#cdd3ee" stroke-width="6" stroke-linecap="round">
    <line x1="232" y1="742" x2="808" y2="742"/>
    <line x1="213" y1="788" x2="827" y2="788"/>
    <line x1="194" y1="834" x2="846" y2="834"/>
  </g>
  <!-- ink being written -->
  <path d="M700 745 C672 768 646 722 620 748 S566 770 540 744 S486 740 466 760"
        fill="none" stroke="#232a63" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- legs (behind body) -->
  <g fill="none" stroke="#c9302a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 592 L262 640 L240 732"/>
    <path d="M366 632 L292 690 L286 752"/>
    <path d="M392 664 L342 722 L346 768"/>
    <path d="M672 592 L762 640 L784 732"/>
    <path d="M658 632 L732 690 L738 752"/>
    <path d="M632 664 L682 722 L678 768"/>
  </g>

  <!-- eye stalks -->
  <g stroke="#c9302a" stroke-width="14" stroke-linecap="round">
    <line x1="452" y1="452" x2="452" y2="414"/>
    <line x1="572" y1="452" x2="572" y2="414"/>
  </g>

  <!-- body -->
  <ellipse cx="512" cy="562" rx="196" ry="132" fill="url(#shell)"/>
  <ellipse cx="450" cy="500" rx="110" ry="46" fill="#ffffff" opacity="0.16" transform="rotate(-14 450 500)"/>
  <g fill="#ffffff" opacity="0.2">
    <circle cx="392" cy="592" r="9"/>
    <circle cx="632" cy="600" r="9"/>
    <circle cx="512" cy="622" r="7"/>
  </g>

  <!-- eyes -->
  <g>
    <circle cx="452" cy="404" r="36" fill="#ffffff"/>
    <circle cx="572" cy="404" r="36" fill="#ffffff"/>
    <circle cx="460" cy="410" r="17" fill="#1b2150"/>
    <circle cx="580" cy="410" r="17" fill="#1b2150"/>
    <circle cx="466" cy="404" r="6" fill="#ffffff"/>
    <circle cx="586" cy="404" r="6" fill="#ffffff"/>
  </g>
  <!-- smile -->
  <path d="M470 548 Q512 584 554 548" fill="none" stroke="#7a1712" stroke-width="10" stroke-linecap="round"/>

  <!-- raised left arm + claw -->
  <path d="M336 540 L258 468" fill="none" stroke="#d6352d" stroke-width="32" stroke-linecap="round"/>
  <g transform="rotate(-18 250 440)">
    <path d="M250 440 L224.6 392.3 A54 54 0 1 0 275.4 392.3 Z" fill="#ec4a38" stroke="#ec4a38" stroke-width="14" stroke-linejoin="round"/>
    <path d="M250 440 L224.6 392.3 A54 54 0 1 0 275.4 392.3 Z" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- pen: tip at (700,745), leaning right; drawn before the claw so the claw grips it -->
  <g transform="translate(700 745) rotate(24.3)">
    <path d="M0 0 L-17 -56 L17 -56 Z" fill="#2a2f45" stroke="#2a2f45" stroke-width="6" stroke-linejoin="round"/>
    <rect x="-22" y="-62" width="44" height="14" rx="5" fill="#b98a1c"/>
    <rect x="-22" y="-340" width="44" height="284" rx="10" fill="url(#pen)"/>
    <rect x="-22" y="-402" width="44" height="66" rx="12" fill="#2a2f45"/>
    <rect x="-9" y="-330" width="9" height="240" rx="4" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- right arm + claw gripping the pen -->
  <path d="M696 556 L782 564" fill="none" stroke="#d6352d" stroke-width="32" stroke-linecap="round"/>
  <g transform="rotate(24.3 782 564)">
    <path d="M782 564 L756.6 516.3 A54 54 0 1 0 807.4 516.3 Z" fill="#ec4a38" stroke="#ec4a38" stroke-width="14" stroke-linejoin="round"/>
    <path d="M782 564 L756.6 516.3 A54 54 0 1 0 807.4 516.3 Z" fill="#ffffff" opacity="0.12"/>
  </g>
</svg>
