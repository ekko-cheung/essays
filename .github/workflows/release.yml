name: Release

# Pushing a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) builds the
# app for macOS and Windows and attaches the installers to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    strategy:
      fail-fast: false
      # Each job merges its platform into latest.json, so run them one at a time
      # to avoid two jobs overwriting each other's entry.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - os: macos-latest # Intel
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # latest.json advertises the app version, so a vX.Y.Z tag must match
      # tauri.conf.json — otherwise clients would never see the update.
      - name: Check tag matches app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles. The public half lives in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Essays ${{ github.ref_name }}
          releaseBody: See the assets below to download the installer for your system.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
